<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMart - Multi-Vendor E-Commerce</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navbar Container -->
  <div id="navbar"></div>

  <main class="container">
    <!-- Hero / Banner Section -->
    <div style="background: linear-gradient(135deg, #1e3a8a, #2874f0); color: white; padding: 2rem; border-radius: var(--radius); margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">MiniMart Multi-Vendor Marketplace</h1>
        <p style="font-size: 1rem; opacity: 0.9;">
          Shop directly from independent verified sellers across Electronics, Fashion, Grocery & more.
        </p>
      </div>
      <div>
        <a href="register.html" class="btn btn-secondary">Open a Seller Shop</a>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <section class="search-filter-card">
      <form id="filter-form" class="search-bar-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="search-input">Search Products</label>
          <input type="text" id="search-input" class="form-control" placeholder="Search by name or description...">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="category-select">Category</label>
          <select id="category-select" class="form-control">
            <option value="all">All Categories</option>
            <!-- Dynamically populated -->
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="min-price">Min Price (₹)</label>
          <input type="number" id="min-price" class="form-control" placeholder="0" min="0">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="max-price">Max Price (₹)</label>
          <input type="number" id="max-price" class="form-control" placeholder="100000" min="0">
        </div>

        <div style="display: flex; gap: 0.5rem;">
          <button type="submit" class="btn btn-primary" style="height: 42px;">Search</button>
          <button type="button" id="reset-filters-btn" class="btn btn-outline" style="height: 42px;">Reset</button>
        </div>
      </form>
    </section>

    <!-- Products Count Header -->
    <div class="page-header" style="margin-bottom: 1rem;">
      <h2 style="font-size: 1.35rem;" id="products-heading">All Products</h2>
      <span id="products-count" style="color: var(--text-muted); font-size: 0.9rem;">Loading products...</span>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="product-grid">
      <!-- Dynamically populated via JavaScript -->
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MiniMart Multi-Vendor Platform. Built for college viva demonstration.</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    const productGrid = document.getElementById('product-grid');
    const categorySelect = document.getElementById('category-select');
    const filterForm = document.getElementById('filter-form');
    const resetBtn = document.getElementById('reset-filters-btn');
    const productsCount = document.getElementById('products-count');
    const productsHeading = document.getElementById('products-heading');

    // 1. Fetch categories for dropdown
    async function loadCategories() {
      try {
        const res = await apiFetch('/categories');
        if (res.categories) {
          res.categories.forEach((cat) => {
            const opt = document.createElement('option');
            opt.value = cat._id;
            opt.textContent = cat.name;
            categorySelect.appendChild(opt);
          });
        }
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    }

    // 2. Fetch and render products with query parameters
    async function loadProducts() {
      productGrid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
          <p>Loading marketplace products...</p>
        </div>
      `;

      const search = document.getElementById('search-input').value.trim();
      const category = categorySelect.value;
      const minPrice = document.getElementById('min-price').value.trim();
      const maxPrice = document.getElementById('max-price').value.trim();

      const params = new URLSearchParams();
      if (search) params.append('search', search);
      if (category && category !== 'all') params.append('category', category);
      if (minPrice) params.append('minPrice', minPrice);
      if (maxPrice) params.append('maxPrice', maxPrice);

      try {
        const res = await apiFetch(`/products?${params.toString()}`);
        const products = res.products || [];

        productsCount.textContent = `Showing ${products.length} product(s)`;

        if (products.length === 0) {
          productGrid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem; background: white; border-radius: var(--radius); border: 1px dashed #cbd5e1;">
              <h3 style="color: #64748b; margin-bottom: 0.5rem;">No products found</h3>
              <p style="color: #94a3b8; font-size: 0.9rem;">Try adjusting your search keyword or clearing the filters.</p>
            </div>
          `;
          return;
        }

        // Render Product Cards
        productGrid.innerHTML = products.map((p) => {
          const sellerName = p.seller?.shopName || p.seller?.name || 'Verified Seller';
          const categoryName = p.category?.name || 'General';
          const isAvailable = p.stock > 0;

          return `
            <div class="product-card">
              <a href="product.html?id=${p._id}" class="product-image-container">
                <img src="${p.image}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop'">
              </a>
              <div class="product-card-body">
                <span class="product-category-tag">${categoryName}</span>
                <a href="product.html?id=${p._id}" style="text-decoration:none; color:inherit;">
                  <h3 class="product-title" title="${p.name}">${p.name}</h3>
                </a>
                <p class="product-seller-info">Sold by: <strong>${sellerName}</strong></p>

                <div class="product-price-row">
                  <div>
                    <span class="product-price">₹${p.price.toLocaleString()}</span>
                  </div>
                  <div>
                    ${
                      isAvailable
                        ? `<span class="product-stock-tag stock-in">In Stock (${p.stock})</span>`
                        : `<span class="product-stock-tag stock-out">Out of Stock</span>`
                    }
                  </div>
                </div>

                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                  <a href="product.html?id=${p._id}" class="btn btn-outline btn-sm" style="flex: 1;">
                    Details
                  </a>
                  <button 
                    class="btn btn-secondary btn-sm" 
                    style="flex: 1.3;"
                    ${!isAvailable ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}
                    onclick="handleAddToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, '${p.image}', ${p.stock}, '${p.seller?._id || ''}', '${sellerName.replace(/'/g, "\\'")}')"
                  >
                    🛒 Add to Cart
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        productGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--danger);">
            <p>Error loading products: ${err.message}</p>
          </div>
        `;
      }
    }

    // Quick Add to cart handler
    function handleAddToCart(id, name, price, image, stock, sellerId, sellerName) {
      const productObj = {
        _id: id,
        name,
        price,
        image,
        stock,
        seller: sellerId,
        sellerName
      };
      addToCart(productObj, 1);
    }

    // Filter Form Submit
    filterForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loadProducts();
    });

    // Reset Filters
    resetBtn.addEventListener('click', () => {
      filterForm.reset();
      loadProducts();
    });

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      loadCategories();
      loadProducts();
    });
  </script>
</body>
</html>
