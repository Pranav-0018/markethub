<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - MiniMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navbar Container -->
  <div id="navbar"></div>

  <main class="container" style="margin-top: 2rem;">
    <!-- Breadcrumb / Back Link -->
    <div style="margin-bottom: 1rem;">
      <a href="index.html" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600;">
        &larr; Back to all products
      </a>
    </div>

    <!-- Product Details Card -->
    <div id="product-detail-container">
      <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
        Loading product details...
      </div>
    </div>

    <!-- Reviews Section -->
    <section class="card" style="margin-top: 2rem;">
      <div class="page-header" style="margin-bottom: 1rem;">
        <h3>Customer Reviews & Ratings</h3>
        <span id="reviews-count-badge" class="badge badge-info">0 Reviews</span>
      </div>

      <!-- Add Review Form (For Customers) -->
      <div id="review-form-container" style="background: #f8fafc; padding: 1.25rem; border-radius: var(--radius); border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
        <!-- Dynamically rendered based on login state -->
      </div>

      <!-- Reviews List -->
      <div id="reviews-list">
        <!-- Dynamically populated -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MiniMart Multi-Vendor Platform. Built for college viva demonstration.</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    let currentProduct = null;

    // Get product ID from URL query parameter ?id=...
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId) {
      window.location.href = 'index.html';
    }

    async function loadProductDetails() {
      const container = document.getElementById('product-detail-container');

      try {
        const res = await apiFetch(`/products/${productId}`);
        currentProduct = res.product;

        if (!currentProduct) {
          container.innerHTML = `<div class="alert alert-danger">Product not found.</div>`;
          return;
        }

        const sellerName = currentProduct.seller?.shopName || currentProduct.seller?.name || 'Verified Seller';
        const sellerEmail = currentProduct.seller?.email || '';
        const categoryName = currentProduct.category?.name || 'General';
        const isAvailable = currentProduct.stock > 0;

        container.innerHTML = `
          <div class="product-detail-layout">
            <!-- Left: Product Image -->
            <div class="product-detail-img-wrap">
              <img src="${currentProduct.image}" alt="${currentProduct.name}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop'">
            </div>

            <!-- Right: Product Info & Buy Action -->
            <div class="product-detail-info">
              <span class="product-category-tag">${categoryName}</span>
              <h1>${currentProduct.name}</h1>

              <div style="display: flex; align-items: center; gap: 1rem; margin: 0.5rem 0;">
                <span class="badge ${isAvailable ? 'badge-approved' : 'badge-rejected'}">
                  ${isAvailable ? `In Stock (${currentProduct.stock} units)` : 'Out of Stock'}
                </span>
                <span style="font-size: 0.85rem; color: var(--text-muted);">
                  Sold by: <strong style="color: var(--text-main);">${sellerName}</strong> (${sellerEmail})
                </span>
              </div>

              <div class="product-detail-price">
                ₹${currentProduct.price.toLocaleString()}
              </div>

              <div style="margin: 1.5rem 0; line-height: 1.7; color: #4b5563;">
                <h4 style="color: #111827; margin-bottom: 0.4rem;">Description:</h4>
                <p>${currentProduct.description}</p>
              </div>

              <!-- Quantity Selector and Add to Cart -->
              <div style="background: #f9fafb; padding: 1.25rem; border-radius: var(--radius); border: 1px solid var(--border-color); max-width: 420px;">
                <div class="form-group" style="margin-bottom: 1rem;">
                  <label for="buy-qty">Quantity:</label>
                  <input type="number" id="buy-qty" class="form-control" value="1" min="1" max="${currentProduct.stock || 1}" ${!isAvailable ? 'disabled' : ''} style="max-width: 120px;">
                </div>

                <div style="display: flex; gap: 0.75rem;">
                  <button 
                    id="add-cart-btn" 
                    class="btn btn-secondary" 
                    style="flex: 1;"
                    ${!isAvailable ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}
                    onclick="addProductToCart()"
                  >
                    🛒 Add to Cart
                  </button>
                  <a href="cart.html" class="btn btn-primary" style="flex: 1;">
                    Go to Cart &rarr;
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;

        renderReviews(currentProduct.reviews || []);
        renderReviewForm();
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
      }
    }

    // Add to cart with user selected quantity
    function addProductToCart() {
      if (!currentProduct) return;
      const qtyInput = document.getElementById('buy-qty');
      const qty = parseInt(qtyInput ? qtyInput.value : 1, 10) || 1;

      addToCart(currentProduct, qty);
    }

    // Render reviews list
    function renderReviews(reviews) {
      const listContainer = document.getElementById('reviews-list');
      const badge = document.getElementById('reviews-count-badge');
      badge.textContent = `${reviews.length} Review(s)`;

      if (reviews.length === 0) {
        listContainer.innerHTML = `
          <p style="color: var(--text-muted); font-size: 0.95rem; font-style: italic;">
            No reviews yet for this product. Be the first verified customer to leave one!
          </p>
        `;
        return;
      }

      listContainer.innerHTML = reviews.map((r) => {
        const stars = '⭐'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        const dateStr = new Date(r.createdAt).toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        return `
          <div style="border-bottom: 1px solid var(--border-color); padding: 1rem 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
              <div>
                <strong style="color: #111827;">${r.userName || 'Customer'}</strong>
                <span class="badge badge-approved" style="font-size: 0.7rem; margin-left: 0.5rem;">Verified Purchase</span>
              </div>
              <span style="font-size: 0.8rem; color: var(--text-muted);">${dateStr}</span>
            </div>
            <div style="color: #f59e0b; margin-bottom: 0.35rem; font-size: 0.95rem;">${stars}</div>
            <p style="color: #374151; font-size: 0.95rem;">${r.comment}</p>
          </div>
        `;
      }).join('');
    }

    // Render the review submission form
    function renderReviewForm() {
      const formWrap = document.getElementById('review-form-container');
      const user = getUser();

      if (!user) {
        formWrap.innerHTML = `
          <p style="font-size: 0.9rem; color: var(--text-muted);">
            Want to rate this product? <a href="login.html" style="color: var(--primary); font-weight: 600;">Log in as Customer</a> to share your verified review.
          </p>
        `;
        return;
      }

      if (user.role !== 'customer') {
        formWrap.innerHTML = `
          <p style="font-size: 0.9rem; color: var(--text-muted);">
            Logged in as <strong>${user.role}</strong>. Only customer accounts who purchased this product can leave reviews.
          </p>
        `;
        return;
      }

      formWrap.innerHTML = `
        <h4 style="margin-bottom: 0.75rem;">Write a Customer Review</h4>
        <div id="review-alert" style="display: none;"></div>

        <form id="submit-review-form">
          <div class="form-row">
            <div class="form-group" style="flex: 0 0 200px;">
              <label for="review-rating">Rating (1 to 5 Stars):</label>
              <select id="review-rating" class="form-control" required>
                <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                <option value="4">⭐⭐⭐⭐☆ (4 - Very Good)</option>
                <option value="3">⭐⭐⭐☆☆ (3 - Average)</option>
                <option value="2">⭐⭐☆☆☆ (2 - Poor)</option>
                <option value="1">⭐☆☆☆☆ (1 - Terrible)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="review-comment">Your Feedback:</label>
            <textarea id="review-comment" class="form-control" placeholder="What did you like or dislike about this product?" required></textarea>
          </div>

          <button type="submit" id="review-submit-btn" class="btn btn-primary btn-sm">
            Submit Review
          </button>
        </form>
      `;

      // Attach listener
      document.getElementById('submit-review-form').addEventListener('submit', handleReviewSubmit);
    }

    async function handleReviewSubmit(e) {
      e.preventDefault();
      const rating = document.getElementById('review-rating').value;
      const comment = document.getElementById('review-comment').value.trim();
      const alertBox = document.getElementById('review-alert');
      const submitBtn = document.getElementById('review-submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      alertBox.style.display = 'none';

      try {
        const res = await apiFetch(`/products/${productId}/reviews`, {
          method: 'POST',
          body: { rating, comment }
        });

        alertBox.className = 'alert alert-success';
        alertBox.textContent = res.message || 'Review submitted successfully!';
        alertBox.style.display = 'block';

        renderReviews(res.reviews);
        document.getElementById('submit-review-form').reset();
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = err.message || 'Could not post review. Ensure you have purchased this product.';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Review';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProductDetails);
  </script>
</body>
</html>
