<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - MiniMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navbar Container -->
  <div id="navbar"></div>

  <main class="container" style="margin-top: 2rem;">
    <div class="page-header">
      <h1>My Order History & Live Tracking</h1>
      <a href="index.html" class="btn btn-outline btn-sm">🛍️ Continue Shopping</a>
    </div>

    <!-- Alert / Toast Container -->
    <div id="orders-alert" style="display: none;"></div>

    <!-- Orders Container -->
    <div id="orders-container">
      <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
        Loading your orders...
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MiniMart Multi-Vendor Platform. Built for college viva demonstration.</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    // Ensure customer is logged in
    requireRole('customer');

    async function loadMyOrders() {
      const container = document.getElementById('orders-container');

      try {
        const res = await apiFetch('/orders/my');
        const orders = res.orders || [];

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: 3.5rem;">
              <h3 style="color: var(--text-muted); margin-bottom: 0.5rem;">No orders placed yet</h3>
              <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
                Browse our marketplace products to make your first purchase!
              </p>
              <a href="index.html" class="btn btn-primary">Browse Products</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map((order) => {
          const dateStr = new Date(order.createdAt).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          const isPlacedActive = true;
          const isShippedActive = order.deliveryStatus === 'shipped' || order.deliveryStatus === 'delivered';
          const isDeliveredActive = order.deliveryStatus === 'delivered';

          return `
            <div class="card" style="margin-bottom: 2rem;">
              <!-- Order Header -->
              <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                <div>
                  <div style="font-size: 0.85rem; color: var(--text-muted);">Order ID</div>
                  <strong style="font-size: 1.1rem; color: #1e293b;">#${order._id.substring(order._id.length - 8).toUpperCase()}</strong>
                  <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 0.5rem;">(${dateStr})</span>
                </div>

                <div style="text-align: right;">
                  <div style="font-size: 0.85rem; color: var(--text-muted);">Total Amount</div>
                  <strong style="font-size: 1.25rem; color: #111827;">₹${order.totalAmount.toLocaleString()}</strong>
                  <div>
                    <span class="badge ${order.paymentStatus === 'paid' ? 'badge-paid' : 'badge-pending'}">
                      Payment: ${order.paymentStatus}
                    </span>
                  </div>
                </div>
              </div>

              <!-- Live Delivery Status Tracker -->
              <div style="margin: 1.5rem 0;">
                <div style="font-size: 0.85rem; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 0.5rem;">
                  Delivery Status: <span style="color: var(--primary);">${order.deliveryStatus}</span>
                </div>

                <div class="tracker-container">
                  <!-- Step 1: Placed -->
                  <div class="tracker-step ${isPlacedActive ? 'active' : ''}">
                    <div class="tracker-circle">✓</div>
                    <div class="tracker-label">Placed</div>
                  </div>

                  <!-- Step 2: Shipped -->
                  <div class="tracker-step ${isShippedActive ? 'active' : ''}">
                    <div class="tracker-circle">2</div>
                    <div class="tracker-label">Shipped</div>
                  </div>

                  <!-- Step 3: Delivered -->
                  <div class="tracker-step ${isDeliveredActive ? 'active' : ''}">
                    <div class="tracker-circle">3</div>
                    <div class="tracker-label">Delivered</div>
                  </div>
                </div>
              </div>

              <!-- Shipping Address -->
              <div style="background: #f8fafc; padding: 0.85rem 1rem; border-radius: var(--radius); font-size: 0.85rem; color: #475569; margin-bottom: 1.25rem;">
                📍 <strong>Shipping Address:</strong> ${order.shippingAddress}
              </div>

              <!-- Ordered Items List -->
              <div>
                <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem; color: #334155;">Items in this order:</h4>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                  ${order.items.map((item) => {
                    const imgUrl = item.product?.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop';
                    const prodId = item.product?._id || item.product;

                    return `
                      <div style="display: flex; justify-content: space-between; align-items: center; background: #ffffff; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.75rem; flex-wrap: wrap; gap: 0.5rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                          <img src="${imgUrl}" alt="${item.name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                          <div>
                            <a href="product.html?id=${prodId}" style="font-weight: 600; text-decoration: none; color: var(--text-main);">
                              ${item.name}
                            </a>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">
                              Seller: ${item.seller?.shopName || item.seller?.name || 'Seller'} &bull; Qty: ${item.quantity}
                            </div>
                          </div>
                        </div>

                        <div style="display: flex; align-items: center; gap: 1rem;">
                          <strong style="color: #111827;">₹${(item.price * item.quantity).toLocaleString()}</strong>
                          <a href="product.html?id=${prodId}" class="btn btn-outline btn-sm">
                            ⭐ Review
                          </a>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- If payment is still pending, offer Pay Now button -->
              ${
                order.paymentStatus === 'pending'
                  ? `
                    <div style="margin-top: 1.25rem; padding-top: 1rem; border-top: 1px dashed var(--border-color); text-align: right;">
                      <button class="btn btn-secondary btn-sm" onclick="payPendingOrder('${order._id}')">
                        💳 Pay Now (Test Mode)
                      </button>
                    </div>
                  `
                  : ''
              }
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
      }
    }

    // Pay for pending order if any
    async function payPendingOrder(orderId) {
      if (!confirm('Simulate instant payment for this order?')) return;

      try {
        await apiFetch(`/orders/${orderId}/pay`, { method: 'PUT' });
        showToast('Payment successful!', 'success');
        loadMyOrders();
      } catch (err) {
        alert(err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadMyOrders);
  </script>
</body>
</html>
